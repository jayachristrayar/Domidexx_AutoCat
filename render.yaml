# Render Blueprint for the AutoCat backend. Lives at the repo root, which
# is where Render's Blueprint deploy looks for it by default -- no need to
# set a custom "Blueprint Path" in the dashboard. The actual app code is in
# backend/, so rootDir below points build/start commands at the right
# subdirectory.
#
# Standard Node buildpack, not Docker: this repo also has backend/Dockerfile
# (for the Z39.50/YAZ system dependency), but that's a separate, opt-in
# deployment path -- this Blueprint intentionally stays on the plain Node
# runtime. Z39.50 lookups already no-op gracefully with a clear log message
# when yaz-client isn't present (see backend/src/services/z3950Lookup.js),
# so this is a safe default, not a silent break.
services:
  - type: web
    name: autocat-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: LIBRARYTHING_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      # Not strictly required by Render (which may already default to this),
      # but set explicitly since the admin login cookie's Secure flag
      # depends on it -- see requireAdminSession.js.
      - key: NODE_ENV
        value: production
